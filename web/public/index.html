<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lead Nurture Flow</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 48px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; }
  form {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin: 24px 0;
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #888;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin: 12px 0; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.92rem; }
  .pass { color: #1a7f37; font-weight: 600; }
  .skip { color: #999; }
  .error { color: #c0392b; }
  a.download { text-decoration: none; }
</style>
</head>
<body>
  <h1>Lead Nurture Flow</h1>
  <p class="subtitle">Upload leads.xlsx, run the score &rarr; research &rarr; draft pipeline, download the resulting .eml files.</p>

  <form id="uploadForm">
    <input type="file" id="leadsFile" name="leadsFile" accept=".xlsx" required>
    <button type="submit" id="runButton">Process Leads</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>

<script>
  const form = document.getElementById('uploadForm');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const runButton = document.getElementById('runButton');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = document.getElementById('leadsFile').files[0];
    if (!file) return;

    runButton.disabled = true;
    status.textContent = 'Processing leads (this calls Claude for each lead — may take a minute)...';
    results.innerHTML = '';

    const formData = new FormData();
    formData.append('leadsFile', file);

    try {
      const res = await fetch('/api/process', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) {
        status.innerHTML = `<span class="error">${data.error || 'Something went wrong.'}</span>`;
        return;
      }

      status.textContent = `Done — ${data.results.length} lead(s) processed.`;
      renderResults(data.runId, data.results);
    } catch (err) {
      status.innerHTML = `<span class="error">Request failed: ${err.message}</span>`;
    } finally {
      runButton.disabled = false;
    }
  });

  function renderResults(runId, rows) {
    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr><th>Lead</th><th>Score</th><th>Outcome</th><th></th></tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');

    for (const row of rows) {
      const tr = document.createElement('tr');
      const label = `${row.name} — ${row.title}`;
      if (row.passed) {
        tr.innerHTML = `
          <td>${label}</td>
          <td>${row.score}/10</td>
          <td class="pass">${row.subject}</td>
          <td><a class="download" href="/api/download/${runId}/${row.id}" download>Download .eml</a></td>
        `;
      } else {
        tr.innerHTML = `
          <td>${label}</td>
          <td>${row.score}/10</td>
          <td class="skip">skipped (below threshold)</td>
          <td></td>
        `;
      }
      tbody.appendChild(tr);
    }

    results.appendChild(table);
  }
</script>
</body>
</html>
